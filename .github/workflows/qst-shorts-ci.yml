name: QST Shorts CI

on:
  push:
    branches:
      - feature/qst-viral-shorts-pipeline
  pull_request:
    paths:
      - 'shorts_generator/**'
      - 'renderers/remotion/**'
      - 'tests/**'
      - 'main.py'
      - '.github/workflows/qst-shorts-ci.yml'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free QST tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  remotion-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderers/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: renderers/remotion/package.json
      - name: Install renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck renderer
        run: npm run typecheck
